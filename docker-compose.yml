# Postgres + the API. `docker compose up --build`, then seed once:
#   docker compose exec app uv run python -m supportagent.db seed
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: p2_agent
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d p2_agent"]
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    build: .
    env_file: [.env.example]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/p2_agent
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
